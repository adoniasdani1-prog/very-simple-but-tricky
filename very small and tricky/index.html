<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Very Simple But Tricky</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.45) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,.18) 0 1px, transparent 2px),
        #c9c8c5;
      background-size: 9px 9px, 13px 13px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 760px;
      height: 450px;
      padding: 45px;
      border-radius: 18px;
      position: relative;
      background:
        linear-gradient(135deg, #07546a 0%, #137b8d 48%, #63d5df 100%);
      box-shadow:
        20px 25px 28px rgba(0,0,0,.38),
        inset 0 1px 1px rgba(255,255,255,.35);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background:
        linear-gradient(140deg, transparent 45%, rgba(255,255,255,.08) 45%, transparent 65%);
      pointer-events: none;
    }

    .inner {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 35px 25px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 80% 80%, rgba(100,230,235,.6), transparent 45%),
        linear-gradient(135deg, #002c40, #0b5060 55%, #55c8d0);
      border: 2px solid rgba(0,0,0,.28);
      box-shadow:
        inset 0 7px 15px rgba(0,0,0,.42),
        inset 0 -5px 15px rgba(255,255,255,.08),
        0 2px 4px rgba(0,0,0,.25);
    }

    h1 {
      color: #83dfe0;
      font-size: 68px;
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow:
        1px 1px 0 #f1ffff,
        2px 2px 0 #052c3c,
        4px 5px 0 #021b2b,
        7px 9px 8px rgba(0,0,0,.65);
    }

    @media (max-width: 800px) {
      .card {
        width: 92vw;
        height: auto;
        min-height: 390px;
        padding: 30px;
      }

      .inner {
        padding: 25px;
      }

      h1 {
        font-size: 9vw;
      }
    }

    @media (max-width: 500px) {
      .card {
        min-height: 300px;
        padding: 20px;
        border-radius: 12px;
      }

      .inner {
        padding: 18px;
        border-radius: 11px;
      }

      h1 {
        font-size: 10vw;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="inner">
      <h1>
        Very Simple<br>
        But Tricky.
      </h1>
    </div>
  </div>

</body>
</html>
